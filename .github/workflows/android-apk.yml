name: SahaBall Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - main_test

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Build web assets for Android
        run: npm run build
        env:
          VITE_SERVER_URL: https://sahaball.opik.net

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Firebase Android resources
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GitHub secret GOOGLE_SERVICES_JSON is missing."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          variables = Path("android/variables.gradle")
          text = variables.read_text()
          if "rgcfaIncludeGoogle" not in text:
              text = text.replace(
                  "ext {",
                  "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'",
                  1,
              )
          variables.write_text(text)

          root_gradle = Path("android/build.gradle")
          text = root_gradle.read_text()
          if "com.google.gms:google-services" not in text:
              text = text.replace(
                  "dependencies {",
                  'dependencies {\n        classpath "com.google.gms:google-services:4.4.2"',
                  1,
              )
          root_gradle.write_text(text)

          app_gradle = Path("android/app/build.gradle")
          text = app_gradle.read_text()
          if "com.google.gms.google-services" not in text:
              text += "\napply plugin: 'com.google.gms.google-services'\n"
          app_gradle.write_text(text)
          PY

          npx cap sync android

      - name: Configure immersive landscape Android activity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app/src/main")
          java_dir = root / "java/com/calisalworks/sahaball"
          java_dir.mkdir(parents=True, exist_ok=True)

          for old in root.rglob("MainActivity.kt"):
              old.unlink()
          for old in root.rglob("MainActivity.java"):
              if old != java_dir / "MainActivity.java":
                  old.unlink()

          activity = java_dir / "MainActivity.java"
          activity.write_text("""package com.calisalworks.sahaball;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              private void hideSystemBars() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      getWindow().setDecorFitsSystemWindows(false);
                      WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(
                              WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      );
                  }
              }
          }
          """.replace("\n          ", "\n"))

          manifest = root / "AndroidManifest.xml"
          text = manifest.read_text()
          text = re.sub(
              r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*)(>)',
              lambda m: m.group(1) + ' android:screenOrientation="landscape" android:windowSoftInputMode="adjustResize"' + m.group(2)
                  if 'android:screenOrientation=' not in m.group(1) else re.sub(r'android:windowSoftInputMode="[^"]*"', 'android:windowSoftInputMode="adjustResize"', m.group(1)) + m.group(2),
              text,
              count=1
          )
          manifest.write_text(text)
          PY

      - name: Configure stable Android debug signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret $name is missing."
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/sahaball-upload-key.jks

          # Fail early if the supplied keystore or alias is invalid.
          keytool -list -keystore android/app/sahaball-upload-key.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()

          # Locate the Android buildTypes block, preserving the generated template.
          match = re.search(r"(?m)^([ \t]*)buildTypes\s*\{", text)
          if not match:
              raise SystemExit("Could not find android buildTypes block")

          indent = match.group(1)
          signing = (
              f"{indent}signingConfigs {{\n"
              f"{indent}    stableDebug {{\n"
              f"{indent}        storeFile file('sahaball-upload-key.jks')\n"
              f"{indent}        storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')\n"
              f"{indent}        keyAlias System.getenv('ANDROID_KEY_ALIAS')\n"
              f"{indent}        keyPassword System.getenv('ANDROID_KEY_PASSWORD')\n"
              f"{indent}    }}\n"
              f"{indent}}}\n\n"
          )
          if "signingConfigs" not in text or "stableDebug" not in text:
              text = text[:match.start()] + signing + text[match.start():]
              match = re.search(r"(?m)^([ \t]*)buildTypes\s*\{", text)

          # Find the matching closing brace for buildTypes.
          open_brace = text.find("{", match.start())
          depth = 0
          close_brace = None
          for i in range(open_brace, len(text)):
              if text[i] == "{":
                  depth += 1
              elif text[i] == "}":
                  depth -= 1
                  if depth == 0:
                      close_brace = i
                      break
          if close_brace is None:
              raise SystemExit("Could not parse android buildTypes block")

          body = text[open_brace + 1:close_brace]
          debug_match = re.search(r"(?m)^([ \t]*)debug\s*\{", body)
          if debug_match:
              # Reuse an existing debug block and force it to use the stable key.
              debug_indent = debug_match.group(1)
              debug_open = open_brace + 1 + debug_match.end() - 1
              depth = 0
              debug_close = None
              for i in range(debug_open, close_brace):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          debug_close = i
                          break
              if debug_close is None:
                  raise SystemExit("Could not parse debug buildType block")
              debug_body = text[debug_open + 1:debug_close]
              debug_body = re.sub(
                  r"(?m)^[ \t]*signingConfig\s+.*$\n?",
                  "",
                  debug_body,
              )
              debug_body = (
                  "\n" + debug_indent +
                  "    signingConfig signingConfigs.stableDebug\n" +
                  debug_body
              )
              text = text[:debug_open + 1] + debug_body + text[debug_close:]
          else:
              debug_block = (
                  f"\n{indent}    debug {{\n"
                  f"{indent}        signingConfig signingConfigs.stableDebug\n"
                  f"{indent}    }}\n"
              )
              text = text[:open_brace + 1] + debug_block + text[open_brace + 1:]

          gradle.write_text(text)

          # Guard against a silent no-op in the Gradle patch.
          check = gradle.read_text()
          if "stableDebug" not in check or not re.search(
              r"debug\s*\{[^}]*signingConfig\s+signingConfigs\.stableDebug",
              check,
              re.S,
          ):
              raise SystemExit("Stable debug signing was not attached to debug buildType")
          PY

            - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Report Android signing fingerprints
        run: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport | tee signing-report.txt

          EXPECTED_SHA1="9D:7E:C2:B5:86:95:7F:FA:2B:6D:AC:61:30:3F:B8:6B:2F:C6:92:07"
          EXPECTED_SHA256="86:42:FE:EF:D7:14:44:04:25:24:0E:A2:A8:F8:75:28:D9:CA:82:1E:9A:C6:5F:C9:7E:5E:16:B1:B9:F4:95:18"

          if ! grep -Fq "SHA1: $EXPECTED_SHA1" signing-report.txt; then
            echo "::error::Debug APK is not signed with the configured stable SHA-1."
            exit 1
          fi
          if ! grep -Fq "SHA-256: $EXPECTED_SHA256" signing-report.txt; then
            echo "::error::Debug APK is not signed with the configured stable SHA-256."
            exit 1
          fi

          {
            echo "### Android signing fingerprints"
            cat signing-report.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SahaBall-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
