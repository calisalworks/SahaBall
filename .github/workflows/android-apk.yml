name: SahaBall Android Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main_test

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main_test
        uses: actions/checkout@v4
        with:
          ref: main_test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run lint

      - name: Build web assets for Android
        run: npm run build
        env:
          VITE_SERVER_URL: https://193.111.125.252

      - name: Generate Android project
        run: npx cap add android

      - name: Configure immersive landscape Android activity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app/src/main")
          java_dir = root / "java/com/calisalworks/sahaball"
          java_dir.mkdir(parents=True, exist_ok=True)

          for old in root.rglob("MainActivity.kt"):
              old.unlink()
          for old in root.rglob("MainActivity.java"):
              if old != java_dir / "MainActivity.java":
                  old.unlink()

          activity = java_dir / "MainActivity.java"
          activity.write_text("""package com.calisalworks.sahaball;

          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hideSystemBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideSystemBars();
              }

              private void hideSystemBars() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      getWindow().setDecorFitsSystemWindows(false);
                      WindowInsetsController controller = getWindow().getInsetsController();
                      if (controller != null) {
                          controller.hide(WindowInsets.Type.statusBars() | WindowInsets.Type.navigationBars());
                          controller.setSystemBarsBehavior(
                              WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          );
                      }
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      );
                  }
              }
          }
          """.replace("\n          ", "\n"))

          manifest = root / "AndroidManifest.xml"
          text = manifest.read_text()
          text = re.sub(
              r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*)(>)',
              lambda m: m.group(1) + ' android:screenOrientation="landscape"' + m.group(2)
                  if 'android:screenOrientation=' not in m.group(1) else m.group(0),
              text,
              count=1
          )
          manifest.write_text(text)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SahaBall-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
